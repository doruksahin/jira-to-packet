name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing vX.Y.Z tag to retry private GitHub artifact publication
        required: false
        type: string

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check release creation setup
        id: credentials
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Release PR creation is not configured. Add RELEASE_PLEASE_TOKEN when enabling private releases; see [release setup](https://github.com/doruksahin/jira-to-packet/blob/main/docs/maintenance.md#private-releases). Existing release artifact retries remain available without this token.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open, update, or publish the release
        id: release
        if: ${{ steps.credentials.outputs.configured == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' || inputs.publish_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha || inputs.publish_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the release identity
        id: identity
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.publish_tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Re-run the release gate
        run: pnpm release:check

      - name: Build and verify release artifacts
        run: |
          pnpm release:artifact "$RUNNER_TEMP/jira-to-packet-release"
          cd "$RUNNER_TEMP/jira-to-packet-release"
          sha256sum --check SHA256SUMS
          node "$GITHUB_WORKSPACE/scripts/smoke-installed-artifact.mjs" \
            "$RUNNER_TEMP/jira-to-packet-release/doruksahin-jira-to-packet-${{ steps.identity.outputs.version }}.tgz"

      - name: Attach or verify package artifacts on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/upload-release-artifacts.mjs \
            "${{ steps.identity.outputs.tag }}" \
            "$RUNNER_TEMP/jira-to-packet-release/doruksahin-jira-to-packet-${{ steps.identity.outputs.version }}.tgz" \
            "$RUNNER_TEMP/jira-to-packet-release/SHA256SUMS"
